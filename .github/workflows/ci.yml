name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Which kind of change is this? Only pull requests are filtered — a push to
  # main always runs everything, because that is the branch being protected and
  # the cost of being wrong there is higher than a few minutes of CI.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "Push to main — running everything."
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA...HEAD")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Anything outside docs/ and *.md is code. Workflow files count as
          # code deliberately: a change to CI has to be exercised by CI.
          if echo "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -qE '(^docs/|\.md$)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Prettier parses Markdown, so malformed documents fail here too.
      - name: Format check
        run: pnpm format:check

      # Catches the failure this repository actually has: a document renamed or
      # removed while something still points at it. No dependency, no config.
      - name: Internal links resolve
        run: |
          set -euo pipefail
          broken=0
          while IFS= read -r line; do
            src="${line%%:*}"
            target="${line#*:}"
            resolved="$(dirname "$src")/$target"
            if [ ! -e "$resolved" ]; then
              echo "::error file=$src::links to missing $target"
              broken=1
            fi
          done < <(
            grep -rnoE '\]\([^)#:]+\.md\)' --include='*.md' . \
              | grep -v node_modules \
              | sed -E 's/^([^:]+):[0-9]+:\]\((.+)\)$/\1:\2/' || true
          )
          exit "$broken"

  code:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test:coverage

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: E2E scenarios
        run: pnpm test:e2e

  # The web app in a real browser, against a fake backend (web/e2e). Covers the
  # setup wizard end to end without a database, YoLink or IFTTT.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter smart-hvac-guardian-web exec playwright install --with-deps chromium

      - name: Type check browser tests
        run: pnpm --filter smart-hvac-guardian-web test:e2e:types

      - name: Browser tests
        run: pnpm web:test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Secrets and identifying data. Runs on every change, docs included: a device
  # ID pasted into a Markdown file leaks as easily as one in code.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pinned, checksum-verified binary rather than gitleaks-action, which
      # needs a paid license for repositories owned by an organization.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks

      # The whole history, every time: it takes under a second, and a leak that
      # is only "in history" is still public.
      - name: Scan history (gitleaks + project rules)
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .

      # Values no pattern can catch — the owner's email, the property's name or
      # address, real device and tenant IDs — kept in a repository secret, one
      # per line. Skipped when the secret isn't set (including on forks).
      # Prints file names only, never what matched.
      - name: Scan for private strings
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${FORBIDDEN_STRINGS}" ]; then
            echo "FORBIDDEN_STRINGS is not set; skipping."
            exit 0
          fi
          patterns="$(mktemp)"
          # Drop blank lines: an empty pattern would match every line.
          printf '%s\n' "${FORBIDDEN_STRINGS}" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$patterns"
          found=0
          if files="$(git grep -lIiF -f "$patterns")"; then
            echo "$files" | sed 's/^/::error file=/;s/$/::contains a private string/'
            found=1
          fi
          if [ "$EVENT" = "pull_request" ] &&
            git log --format=%B "${BASE_SHA}..HEAD" | grep -qiF -f "$patterns"; then
            echo "::error::A commit message in this pull request contains a private string"
            found=1
          fi
          rm -f "$patterns"
          exit "$found"

  # The single check to mark required in branch protection.
  #
  # A job skipped by a path filter reports as "skipped", not "success", so
  # requiring `code` directly would block every documentation-only pull request
  # forever. This one always runs and fails only if something that did run
  # failed.
  gate:
    needs: [changes, docs, code, e2e, web, secrets]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "docs:    ${{ needs.docs.result }}"
          echo "code:    ${{ needs.code.result }}"
          echo "e2e:     ${{ needs.e2e.result }}"
          echo "web:     ${{ needs.web.result }}"
          echo "secrets: ${{ needs.secrets.result }}"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
