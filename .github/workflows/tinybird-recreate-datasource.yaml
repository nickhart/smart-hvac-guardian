name: Tinybird Recreate Datasource (manual)

# `tinybird deploy` detects datasources appearing and disappearing, but not
# changes to the schema of one that already exists: adding a column to a
# .datasource file deploys as "△ Not deploying. No changes." Both the normal and
# the --allow-destructive-operations paths behave this way, so the flag is not
# the issue — detection is.
#
# This turns a schema change into a presence change: drop the datasource through
# the Datasources API, then deploy, which recreates it from the .datasource file
# with the current schema. Drop and recreate happen in one run so ingestion is
# only 404ing for a few seconds.
#
# DESTRUCTIVE: every row in the named datasources is lost. Export first if the
# data matters.

on:
  workflow_dispatch:
    inputs:
      datasources:
        description: "Comma-separated datasource names to drop and recreate"
        required: true
        default: "sensor_events_v2,hvac_commands_v2,hvac_state_events_v2"
        type: string
      confirm:
        description: "Type DELETE to confirm dropping these datasources and losing their rows"
        required: true
        type: string

env:
  TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}

jobs:
  recreate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'DELETE'
        run: |
          echo "::error::Confirmation failed. Type DELETE exactly to run this workflow."
          exit 1

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Drop each datasource
        run: |
          BASE_URL=$(jq -r '.baseUrl' tinybird.config.json)
          echo "Workspace: $BASE_URL"

          IFS=',' read -ra NAMES <<< "${{ inputs.datasources }}"
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -z "$name" ] && continue

            if [ ! -f "tinybird/datasources/${name}.datasource" ]; then
              echo "::error::No tinybird/datasources/${name}.datasource in the repo."
              echo "Refusing to drop a datasource the deploy cannot recreate."
              exit 1
            fi

            echo "Dropping ${name}..."
            status=$(curl -sS -o /tmp/drop-body -w '%{http_code}' \
              -X DELETE "${BASE_URL}/v0/datasources/${name}" \
              -H "Authorization: Bearer ${TINYBIRD_TOKEN}")

            # 404 means it is already gone, which is the state we want anyway.
            if [ "$status" = "204" ] || [ "$status" = "200" ] || [ "$status" = "404" ]; then
              echo "  HTTP ${status} — ok"
            else
              echo "::error::Drop of ${name} failed with HTTP ${status}"
              cat /tmp/drop-body
              exit 1
            fi
          done

      - name: Recreate from the repo definitions
        run: pnpm exec tinybird deploy

      - name: Confirm the deploy created them
        run: |
          BASE_URL=$(jq -r '.baseUrl' tinybird.config.json)
          IFS=',' read -ra NAMES <<< "${{ inputs.datasources }}"
          failed=0
          for raw in "${NAMES[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -z "$name" ] && continue
            status=$(curl -sS -o /tmp/check-body -w '%{http_code}' \
              "${BASE_URL}/v0/datasources/${name}" \
              -H "Authorization: Bearer ${TINYBIRD_TOKEN}")
            if [ "$status" = "200" ]; then
              echo "${name}: present"
              jq -r '.columns[]?.name' /tmp/check-body 2>/dev/null | sed 's/^/    /' || true
            else
              echo "::error::${name} is missing after deploy (HTTP ${status})"
              failed=1
            fi
          done
          exit $failed
